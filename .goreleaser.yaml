# The release binaries of unicode (docs/design.md §8), built by
# .github/workflows/release.yml when a v* tag is pushed. Each carries the
# viewer's pages, which the before hooks build into internal/serve/ui/dist.
version: 2

project_name: unicode

before:
  hooks:
    - pnpm --dir web install --frozen-lockfile
    - pnpm --dir web build

builds:
  - id: unicode
    main: ./cmd/unicode
    binary: unicode
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    # unicode --version prints the tag as it is written, v included, as go install …@tag would.
    ldflags:
      - -s -w -X main.version=v{{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt
