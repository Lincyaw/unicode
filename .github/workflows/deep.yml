name: deep

# The deep verification stage (CLAUDE.md principle 9): expensive, so it runs
# only on demand, after the user agrees. It never gates a merge; a red run
# becomes a fix task.
on:
  workflow_dispatch:

jobs:
  deep:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make deep
