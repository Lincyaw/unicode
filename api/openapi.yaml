openapi: 3.0.0
info:
  title: unicode viewer API
  version: 0.1.0
  description: |-
    The interface of the unicode viewer (docs/design.md §7.5). `unicode serve` answers it from the snapshot that
    `unicode build` wrote to .unicode/graph.json, checked on load as `unicode check` checks it. It is read-only: the
    viewer keeps its selection, tabs, expansions and navigation trail in the page address, not on the server.

    Identities are those of docs/model.md §7. They contain ".", "#", ":" and "/", so every identity travels in a query
    parameter, never in a path segment. JSON field names are the design's, in lower camel case, as the command line's
    JSON already writes them.

    Evidence and review fields are optional until a measurement or a matching review exists; unmeasured data is
    absent rather than reported as a successful or complete check.
tags: []
paths:
  /code:
    get:
      operationId: getCode
      description: |-
        Lines of a file: the whole file when no range is given. The path must be a design or corpus file, or a code file of
        the snapshot; any other path is refused, so the server reads no file outside what the graph describes.
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
          explode: false
        - name: from
          in: query
          required: false
          schema:
            type: integer
            format: int32
          explode: false
        - name: to
          in: query
          required: false
          schema:
            type: integer
            format: int32
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeExcerpt'
        '400':
          description: |-
            The request is malformed or does not apply: a view that does not take the input (`serve.not-applicable`), a
            revision that git cannot read (`serve.bad-revision`), a path outside the repository (`serve.bad-path`), or a
            parameter that is missing, not of its type, or not read by the view it is given to (`serve.bad-parameter`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The request names a node, an edge, a file or an endpoint that the snapshot or the interface does not have (`serve.not-found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '405':
          description: 'The request is not a GET or a HEAD: the interface is read-only (`serve.bad-parameter`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: 'The server failed to answer: the graph of a base revision cannot be built, or the server itself failed (`serve.internal-error`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: |-
            The snapshot file stopped being readable while the server runs (`serve.unreadable-snapshot`); once it is readable
            again, the next request is answered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /compare:
